<body>
  <main>
    <h1>التحقق من الدعوات</h1>
    <p>أحمد وحنين — 27 نوفمبر 2026</p>

    <div id="reader"></div>

    <button id="start-button" type="button">
      تشغيل الكاميرا ومسح QR
    </button>

    <button id="stop-button" type="button" disabled>
      إيقاف الكاميرا
    </button>

    <div id="result" role="status" aria-live="polite"></div>

    <p class="note">
      يجب أن تكون صفحة المسح متاحة عبر HTTPS للسماح باستخدام الكاميرا.
    </p>
  </main>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <script>
    (() => {
      const readerElement = document.getElementById("reader");
      const startButton = document.getElementById("start-button");
      const stopButton = document.getElementById("stop-button");
      const result = document.getElementById("result");

      let scanner = null;
      let starting = false;
      let processing = false;

      function showResult(message, type) {
        result.textContent = message;
        result.className = type;
        result.style.display = "block";
      }

      async function stopScanner() {
        if (!scanner || !scanner.isScanning) {
          stopButton.disabled = true;
          return;
        }

        try {
          await scanner.stop();
        } catch (error) {
          console.error("Scanner stop error:", error);
        }

        stopButton.disabled = true;
        startButton.disabled = false;
      }

      async function handleScan(decodedText) {
        if (processing) return;
        processing = true;

        await stopScanner();

        // لا نعتبر الدعوة مقبولة بمجرد قراءة QR.
        // يجب التحقق من الرمز على الخادم قبل السماح بالدخول.
        showResult(
          "تمت قراءة QR، لكن التحقق من صلاحية الدعوة غير مفعّل بعد. لا تسمح بالدخول بناءً على هذه الرسالة.",
          "info"
        );

        console.log("QR scanned. Server verification is not configured.");
        processing = false;
      }

      startButton.addEventListener("click", async () => {
        if (starting) return;

        starting = true;
        startButton.disabled = true;
        showResult("جارٍ تشغيل الكاميرا...", "info");

        try {
          if (!window.Html5Qrcode) {
            throw new Error("تعذّر تحميل مكتبة مسح QR.");
          }

          scanner = new Html5Qrcode("reader");

          await scanner.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 230, height: 230 } },
            handleScan,
            () => {}
          );

          stopButton.disabled = false;
          showResult("وجّه الكاميرا نحو QR الدعوة.", "info");
        } catch (error) {
          console.error(error);
          showResult(
            "تعذّر تشغيل الكاميرا. تأكد من السماح باستخدامها وفتح الصفحة عبر HTTPS.",
            "error"
          );
          startButton.disabled = false;
        } finally {
          starting = false;
        }
      });

      stopButton.addEventListener("click", stopScanner);
    })();
  </script>
</body>
