
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f2e8">
  <title>التحقق من دعوات الزفاف</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px 14px;
      min-height: 100vh;
      background: #f8f2e8;
      color: #382f28;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      width: 100%;
      max-width: 480px;
      margin: 20px auto;
      padding: 24px 18px;
      background: #fffdf9;
      border: 1px solid #dfcfb0;
      border-radius: 18px;
      box-shadow: 0 8px 30px #5c482015;
    }

    h1 { color: #aa8954; font-size: 26px; }
    p { line-height: 1.8; }

    input {
      display: block;
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border: 1px solid #dfcfb0;
      border-radius: 10px;
      font-size: 16px;
      direction: ltr;
      text-align: left;
    }

    button {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border: 0;
      border-radius: 10px;
      background: #aa8954;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled { opacity: 0.55; cursor: not-allowed; }

    #reader {
      width: 100%;
      margin: 20px auto;
      overflow: hidden;
      border-radius: 12px;
    }

    #result {
      display: none;
      margin-top: 18px;
      padding: 16px;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .info { background: #f4ead7; color: #6c532b; }
    .success { background: #e0f4e5; color: #176534; }
    .error { background: #fbe4e4; color: #a51d1d; }
    .note { font-size: 13px; color: #75685c; }
    [hidden] { display: none !important; }
  </style>
</head>

<body>
  <main>
    <h1>التحقق من الدعوات</h1>
    <p>أحمد وحنين — 27 نوفمبر 2026</p>

    <section id="login-section">
      <p>تسجيل دخول موظف الاستقبال</p>
      <form id="login-form">
        <input
          id="email"
          type="email"
          placeholder="البريد الإلكتروني للموظف"
          autocomplete="username"
          required
        >
        <input
          id="password"
          type="password"
          placeholder="كلمة المرور"
          autocomplete="current-password"
          required
        >
        <button id="login-button" type="submit">تسجيل الدخول</button>
      </form>
    </section>

    <section id="scanner-section" hidden>
      <p id="staff-status">تم تسجيل الدخول</p>
      <button id="start-button" type="button">تشغيل الكاميرا ومسح QR</button>
      <button id="stop-button" type="button" disabled>إيقاف الكاميرا</button>
      <button id="logout-button" type="button">تسجيل الخروج</button>
      <div id="reader"></div>
    </section>

    <div id="result" role="status" aria-live="polite"></div>

    <p class="note">
      يجب فتح الصفحة عبر HTTPS والسماح باستخدام الكاميرا.
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="./config.js"></script>

  <script>
    (() => {
      const cfg = window.INVITE_CONFIG || {};
      const loginSection = document.getElementById("login-section");
      const scannerSection = document.getElementById("scanner-section");
      const loginForm = document.getElementById("login-form");
      const loginButton = document.getElementById("login-button");
      const startButton = document.getElementById("start-button");
      const stopButton = document.getElementById("stop-button");
      const logoutButton = document.getElementById("logout-button");
      const result = document.getElementById("result");
      const staffStatus = document.getElementById("staff-status");

      let scanner = null;
      let starting = false;
      let processing = false;
      let lastScan = "";
      let lastScanTime = 0;

      function showResult(message, type = "info") {
        result.textContent = message;
        result.className = type;
        result.style.display = "block";
      }

      if (
        !window.supabase ||
        !cfg.supabaseUrl ||
        !cfg.supabaseAnonKey ||
        cfg.supabaseAnonKey.startsWith("PASTE_")
      ) {
        loginButton.disabled = true;
        showResult(
          "إعدادات Supabase غير مكتملة. تأكد من config.js والمفتاح العام.",
          "error"
        );
        return;
      }

      const supabase = window.supabase.createClient(
        cfg.supabaseUrl,
        cfg.supabaseAnonKey
      );

      async function stopScanner() {
        if (scanner && scanner.isScanning) {
          try {
            await scanner.stop();
          } catch (error) {
            console.error("Scanner stop error:", error);
          }
        }

        stopButton.disabled = true;
        startButton.disabled = false;
      }

      function showLogin() {
        loginSection.hidden = false;
        scannerSection.hidden = true;
        staffStatus.textContent = "";
      }

      function showScanner(user) {
        loginSection.hidden = true;
        scannerSection.hidden = false;
        staffStatus.textContent = "تم تسجيل الدخول: " + user.email;
      }

      async function getTokenFromQr(decodedText) {
        const value = decodedText.trim();

        try {
          const url = new URL(value);
          const token = url.searchParams.get("t");
          if (token) return token;
        } catch (_) {
          // قد يحتوي QR على الرمز نفسه بدل رابط.
        }

        return value;
      }

      async function handleScan(decodedText) {
        if (processing) return;

        const now = Date.now();
        if (decodedText === lastScan && now - lastScanTime < 3000) return;

        lastScan = decodedText;
        lastScanTime = now;
        processing = true;
        startButton.disabled = true;

        await stopScanner();
        showResult("جارٍ التحقق من الدعوة على الخادم...", "info");

        try {
          const token = await getTokenFromQr(decodedText);

          if (!token || token.length < 32 || token.length > 512) {
            showResult("رمز QR غير صالح.", "error");
            return;
          }

          const { data, error } = await supabase.functions.invoke(
            "redeem-invitation",
            { body: { token } }
          );

          if (error) {
            console.error("Invitation check error:", error);
            const status = error.context?.status;

            if (status === 401) {
              await supabase.auth.signOut();
              showLogin();
              showResult("انتهت جلسة الموظف. سجّل الدخول مرة أخرى.", "error");
            } else if (status === 403) {
              showResult("هذا الحساب غير مخوّل لمسح الدعوات.", "error");
            } else if (status === 409) {
              showResult("الدعوة غير صالحة أو سبق استخدامها.", "error");
            } else {
              showResult(
                "تعذّر التحقق من الدعوة. لا تسمح بالدخول؛ افحص إعدادات الخادم.",
                "error"
              );
            }
            return;
          }

          if (data && data.ok === true) {
            const label = data.guest_label
              ? " — " + data.guest_label
              : "";
            showResult("تم قبول الدخول" + label, "success");
          } else {
            showResult(
              data?.message || "الدعوة غير صالحة أو سبق استخدامها.",
              "error"
            );
          }
        } catch (error) {
          console.error(error);
          showResult(
            "تعذّر الاتصال بالخادم. لا تسمح بالدخول قبل نجاح التحقق.",
            "error"
          );
        } finally {
          processing = false;
        }
      }

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        loginButton.disabled = true;
        showResult("جارٍ تسجيل الدخول...", "info");

        try {
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;

          const { data, error } = await supabase.auth.signInWithPassword({
            email,
            password
          });

          if (error) {
            showResult("فشل تسجيل الدخول. تأكد من البريد وكلمة المرور.", "error");
            return;
          }

          showScanner(data.user);
          showResult("تم تسجيل الدخول. يمكنك الآن مسح الدعوات.", "success");
        } catch (error) {
          console.error(error);
          showResult("حدث خطأ أثناء تسجيل الدخول.", "error");
        } finally {
          loginButton.disabled = false;
        }
      });

      startButton.addEventListener("click", async () => {
        if (starting || processing) return;
        starting = true;
        startButton.disabled = true;
        showResult("جارٍ تشغيل الكاميرا...", "info");

        try {
          const { data } = await supabase.auth.getSession();
          if (!data.session) {
            showLogin();
            showResult("يرجى تسجيل دخول الموظف أولًا.", "error");
            return;
          }

          if (!window.Html5Qrcode) {
            throw new Error("QR library unavailable");
          }

          scanner = new Html5Qrcode("reader");

          await scanner.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 230, height: 230 } },
            handleScan,
            () => {}
          );

          stopButton.disabled = false;
          showResult("وجّه الكاميرا نحو QR الدعوة.", "info");
        } catch (error) {
          console.error(error);
          showResult(
            "تعذّر تشغيل الكاميرا. تأكد من HTTPS وصلاحية الكاميرا.",
            "error"
          );
          startButton.disabled = false;
        } finally {
          starting = false;
        }
      });

      stopButton.addEventListener("click", stopScanner);

      logoutButton.addEventListener("click", async () => {
        await stopScanner();
        const { error } = await supabase.auth.signOut();

        if (error) {
          showResult("تعذّر تسجيل الخروج. حاول مرة أخرى.", "error");
          return;
        }

        showLogin();
        showResult("تم تسجيل الخروج.", "info");
      });

      supabase.auth.getSession().then(({ data, error }) => {
        if (error) {
          showLogin();
          return;
        }

        if (data.session?.user) {
          showScanner(data.session.user);
        } else {
          showLogin();
        }
      });
    })();
  </script>
</body>
</html>
